[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "2.2.0"
edition = "2021"
license = "MIT"
authors = ["Brashkie"]
repository = "https://github.com/Brashkie/kebitx"
homepage = "https://github.com/Brashkie/kebitx"

[workspace.dependencies]
kebitx-core = { path = "crates/kebitx-core" }
kebitx-build = { path = "crates/kebitx-build" }
kebitx-repair = { path = "crates/kebitx-repair" }
kebitx-migrate = { path = "crates/kebitx-migrate" }
kebitx-java = { path = "crates/kebitx-java" }
