[package]
name = "kebitx-build"
description = "Add-on builder: filters over a scratch copy, the analysis as a gate, export"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
kebitx-core.workspace = true

# An example filter, and the one the tests run: it shows the whole filter
