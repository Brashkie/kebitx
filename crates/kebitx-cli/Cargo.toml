[package]
name = "kebitx-cli"
description = "Command-line interface for the kebitx engine"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "kebitx"
path = "src/main.rs"

[features]
# PNG unfiltering in Zig, built by Zig 0.14 for the target. Off by default.
native = ["kebitx-core/native"]

[dependencies]
kebitx-core.workspace = true
kebitx-build.workspace = true
kebitx-repair.workspace = true
kebitx-world.workspace = true
kebitx-migrate.workspace = true
kebitx-java.workspace = true
