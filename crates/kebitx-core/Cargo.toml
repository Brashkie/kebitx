[package]
name = "kebitx-core"
description = "Semantic resolution engine for Minecraft Bedrock projects"
version.workspace = true
edition.workspace = true
license.workspace = true

# With `native`, DEFLATE, zlib and PNG unfiltering go through kebitx-native
# (libdeflate and Zig, built by Zig); without it, the library is pure Rust
# with no dependency.
[features]
native = ["dep:kebitx-native", "kebitx-native/native"]

[dependencies]
kebitx-native = { workspace = true, optional = true }

# Benchmarks only.
[dev-dependencies]
criterion = "0.8"

[[bench]]
name = "engine"
harness = false
