[package]
name = "kebitx-core"
description = "Semantic resolution engine for Minecraft Bedrock projects"
version.workspace = true
edition.workspace = true
license.workspace = true

# With `native`, PNG unfiltering goes through kebitx-native (Zig); without it,
# the library is pure Rust. There is no third-party code either way.
[features]
native = ["dep:kebitx-native", "kebitx-native/native"]

[dependencies]
kebitx-native = { workspace = true, optional = true }


[[bench]]
name = "engine"
harness = false
