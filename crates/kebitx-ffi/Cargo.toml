[package]
name = "kebitx-ffi"
description = "C ABI for the kebitx engine: the only crate where unsafe is allowed"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
# cdylib: kebitx_ffi.dll / .so / .dylib for C, Zig and any other language;
# rlib: so the Rust tests can call the same functions.
crate-type = ["cdylib", "rlib"]

[dependencies]
kebitx-core.workspace = true
